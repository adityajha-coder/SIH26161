<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1850" width="1600" height="1850">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: 700; fill: #F8FAFC; text-anchor: middle; letter-spacing: 1px; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 400; fill: #94A3B8; text-anchor: middle; }
      .section-label { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #64748B; text-transform: uppercase; letter-spacing: 1.5px; }
      
      .terminator { fill: #1E293B; stroke: #94A3B8; stroke-width: 2.5; }
      .process { fill: #131B2E; stroke: #475569; stroke-width: 2; }
      .decision { fill: #162035; stroke: #60A5FA; stroke-width: 2.5; }
      .io { fill: #172033; stroke: #64748B; stroke-width: 2; }
      .datastore { fill: #141E33; stroke: #94A3B8; stroke-width: 2; }
      
      .box-title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 600; fill: #F8FAFC; text-anchor: middle; }
      .box-desc { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 400; fill: #94A3B8; text-anchor: middle; }
      
      .line { stroke: #64748B; stroke-width: 2; fill: none; stroke-linejoin: round; }
      .line-accent { stroke: #60A5FA; stroke-width: 2; fill: none; stroke-linejoin: round; }
      .branch-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 12.5px; font-weight: 600; fill: #CBD5E1; text-anchor: middle; }
      
      .legend-box { fill: #0F172A; stroke: #334155; stroke-width: 1.5; }
      .legend-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 500; fill: #94A3B8; }
      .container-box { fill: #0E1526; stroke: #1E293B; stroke-width: 1.5; stroke-dasharray: 6 6; rx: 12; ry: 12; }
    </style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60A5FA" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Flowchart Header -->
  <text x="800" y="55" class="title">STRATA SYSTEM ARCHITECTURE &amp; EXECUTION FLOWCHART</text>
  <text x="800" y="82" class="subtitle">Standard Flowchart Specification: Hydrodynamic Inception, Numerical Solving, Satellite Pipeline &amp; Statutory EAP</text>

  <!-- ==================== STAGE 1: INCEPTION & BREACH MECHANICS ==================== -->
  <rect x="70" y="110" width="1460" height="370" class="container-box" />
  <text x="95" y="135" class="section-label">Stage 1: Inception &amp; Upstream Breach Hydrodynamics</text>

  <!-- Terminator: Start -->
  <rect x="660" y="150" width="280" height="50" rx="25" ry="25" class="terminator" />
  <text x="800" y="181" class="box-title">System Inception / Scenario Trigger</text>

  <!-- Flow: Start -> Input -->
  <line x1="800" y1="200" x2="800" y2="235" class="line" marker-end="url(#arrow)" />

  <!-- Input Data (Parallelogram) -->
  <polygon points="630,285 660,235 970,235 940,285" class="io" />
  <text x="800" y="260" class="box-title">Input Dam &amp; Reservoir Parameters</text>
  <text x="800" y="278" class="box-desc">Crest Elevation, Storage Volume, Breach Trigger Mode</text>

  <!-- Flow: Input -> Decision Dam Type -->
  <line x1="800" y1="285" x2="800" y2="320" class="line" marker-end="url(#arrow)" />

  <!-- Decision: Dam Type (Diamond) -->
  <polygon points="800,320 960,370 800,420 640,370" class="decision" />
  <text x="800" y="365" class="box-title">Dam Structure</text>
  <text x="800" y="383" class="box-desc">Type Classification?</text>

  <!-- Left Branch: Earthen / Rockfill -->
  <path d="M 640 370 L 370 370 L 370 410" class="line" marker-end="url(#arrow)" />
  <rect x="440" y="352" width="130" height="22" rx="4" ry="4" fill="#0B0F19" />
  <text x="505" y="367" class="branch-text">Rockfill / Earthen</text>

  <rect x="220" y="410" width="300" height="54" rx="5" ry="5" class="process" />
  <text x="370" y="432" class="box-title">Froehlich (2008) Breach Inception</text>
  <text x="370" y="450" class="box-desc">B_avg = 0.27·K0·Vw^0.32·hb^0.04 | tf = 63.2·√(Vw/ghb²)</text>

  <!-- Right Branch: Concrete Gravity / Arch -->
  <path d="M 960 370 L 1230 370 L 1230 410" class="line" marker-end="url(#arrow)" />
  <rect x="1030" y="352" width="145" height="22" rx="4" ry="4" fill="#0B0F19" />
  <text x="1102" y="367" class="branch-text">Concrete Gravity / Arch</text>

  <rect x="1080" y="410" width="300" height="54" rx="5" ry="5" class="process" />
  <text x="1230" y="432" class="box-title">USBR / Broad-Crested Weir Formulation</text>
  <text x="1230" y="450" class="box-desc">Qp = (8/27)·√g·B·h0^(3/2) | Monolith Dislodgement</text>


  <!-- ==================== STAGE 2: HYDRODYNAMIC SIMULATION ==================== -->
  <rect x="70" y="510" width="1460" height="430" class="container-box" />
  <text x="95" y="535" class="section-label">Stage 2: Core 2D SWE Numerical Solver &amp; Physical Verification</text>

  <!-- Convergence to Hydrograph Synthesis -->
  <path d="M 370 464 L 370 495 L 800 495 L 800 545" class="line" />
  <path d="M 1230 464 L 1230 495 L 800 495" class="line" />
  <line x1="800" y1="495" x2="800" y2="545" class="line" marker-end="url(#arrow)" />

  <!-- Process: Hydrograph Synthesis -->
  <rect x="620" y="545" width="360" height="54" rx="5" ry="5" class="process" />
  <text x="800" y="567" class="box-title">Hydrograph Synthesis &amp; Mass Balance</text>
  <text x="800" y="585" class="box-desc">Composite Simpson 1/3 Integration (Error &lt; 0.01% Vw)</text>

  <!-- Data Store: PostGIS (Cylinder) -->
  <g transform="translate(180, 545)">
    <!-- Top ellipse -->
    <path d="M 0 12 A 120 16 0 0 1 240 12 A 120 16 0 0 1 0 12" class="datastore" />
    <!-- Cylinder body -->
    <path d="M 0 12 L 0 50 A 120 16 0 0 0 240 50 L 240 12" class="datastore" />
    <text x="120" y="32" class="box-title">PostgreSQL 16 + PostGIS</text>
    <text x="120" y="48" class="box-desc">Copernicus 30m DEM &amp; River Reach</text>
  </g>

  <!-- Connect PostGIS & Hydrograph into SWE Kernel -->
  <path d="M 300 611 L 300 655 L 700 655 L 700 640" class="line" />
  <line x1="800" y1="599" x2="800" y2="635" class="line" marker-end="url(#arrow)" />

  <!-- Process: 2D SWE Kernel -->
  <rect x="580" y="635" width="440" height="54" rx="5" ry="5" class="process" />
  <text x="800" y="657" class="box-title">2D Shallow Water Equations (SWE) Finite Volume Solver</text>
  <text x="800" y="675" class="box-desc">HLL Approximate Riemann Solver | Conserved State U = [h, hu, hv]^T</text>

  <!-- Flow: SWE to Bed Slope / Friction -->
  <line x1="800" y1="689" x2="800" y2="720" class="line" marker-end="url(#arrow)" />

  <!-- Process: Audusse & Manning -->
  <rect x="580" y="720" width="440" height="54" rx="5" ry="5" class="process" />
  <text x="800" y="742" class="box-title">Audusse Hydrostatic Bed Slope &amp; Semi-Implicit Manning</text>
  <text x="800" y="760" class="box-desc">Well-Balanced C-Property Scheme | Unconditional Friction Stability</text>

  <!-- Flow: To Verification Decision -->
  <line x1="800" y1="774" x2="800" y2="805" class="line" marker-end="url(#arrow)" />

  <!-- Decision: Analytical Convergence (Diamond) -->
  <polygon points="800,805 970,855 800,905 630,855" class="decision" />
  <text x="800" y="850" class="box-title">Ritter Analytical PDE</text>
  <text x="800" y="868" class="box-desc">Error Norm &lt; 0.5% Target?</text>

  <!-- Loop back if No -->
  <path d="M 630 855 L 490 855 L 490 662 L 575 662" class="line-accent" marker-end="url(#arrow-blue)" />
  <rect x="500" y="745" width="60" height="22" rx="4" ry="4" fill="#0B0F19" />
  <text x="530" y="760" class="branch-text" fill="#60A5FA">No</text>

  <!-- Advance if Yes -->
  <line x1="800" y1="905" x2="800" y2="955" class="line" marker-end="url(#arrow)" />
  <rect x="808" y="915" width="50" height="22" rx="4" ry="4" fill="#0B0F19" />
  <text x="833" y="930" class="branch-text">Yes</text>


  <!-- ==================== STAGE 3: SATELLITE RADAR & DATA FUSION ==================== -->
  <rect x="70" y="965" width="1460" height="380" class="container-box" />
  <text x="95" y="990" class="section-label">Stage 3: Multi-Sensor Satellite Observation &amp; SPH Physics Fusion</text>

  <!-- Parallel Branch 3A: 3D SPH Adapter -->
  <rect x="220" y="1015" width="340" height="54" rx="5" ry="5" class="process" />
  <text x="390" y="1037" class="box-title">3D SPH DualSPHysics Benchmark Adapter</text>
  <text x="390" y="1055" class="box-desc">Lagrangian Particles | Plunge-Pool Splash &amp; Impact</text>

  <!-- Path from Stage 2 Yes to 3A and 3B -->
  <path d="M 800 955 L 800 985 L 390 985 L 390 1010" class="line" marker-end="url(#arrow)" />
  <path d="M 800 985 L 1150 985 L 1150 1010" class="line" marker-end="url(#arrow)" />

  <!-- Parallel Branch 3B: GEE Sentinel-1 SAR Pipeline -->
  <rect x="980" y="1010" width="340" height="54" rx="5" ry="5" class="process" />
  <text x="1150" y="1032" class="box-title">Sentinel-1 C-SAR IW GRD Telemetry</text>
  <text x="1150" y="1050" class="box-desc">VV+VH Polarization | Otsu Radar Differencing (&lt; -17.5 dB)</text>

  <!-- Flow 3B -> HAND Filter -->
  <line x1="1150" y1="1064" x2="1150" y2="1095" class="line" marker-end="url(#arrow)" />

  <rect x="980" y="1095" width="340" height="54" rx="5" ry="5" class="process" />
  <text x="1150" y="1117" class="box-title">Adaptive 55m Gorge HAND Topographic Filter</text>
  <text x="1150" y="1135" class="box-desc">Eliminates Mountain Radar Shadow False Positives</text>

  <!-- Flow HAND -> Sentinel-2 NDSI -->
  <line x1="1150" y1="1149" x2="1150" y2="1180" class="line" marker-end="url(#arrow)" />

  <rect x="980" y="1180" width="340" height="54" rx="5" ry="5" class="process" />
  <text x="1150" y="1202" class="box-title">Sentinel-2 MSI NDSI Scarp Collapse Detection</text>
  <text x="1150" y="1220" class="box-desc">NDSI = (B3 - B11) / (B3 + B11) | Avalanche Detachment</text>

  <!-- Data Store: MinIO S3 -->
  <g transform="translate(680, 1070)">
    <path d="M 0 12 A 120 16 0 0 1 240 12 A 120 16 0 0 1 0 12" class="datastore" />
    <path d="M 0 12 L 0 50 A 120 16 0 0 0 240 50 L 240 12" class="datastore" />
    <text x="120" y="32" class="box-title">MinIO S3 Object Store</text>
    <text x="120" y="48" class="box-desc">Pre-Tiled Terrain-RGB &amp; Rasters</text>
  </g>

  <!-- Fusion Process Node -->
  <rect x="580" y="1265" width="440" height="54" rx="5" ry="5" class="process" />
  <text x="800" y="1287" class="box-title">Hydrodynamic &amp; Satellite Multi-Sensor Fusion</text>
  <text x="800" y="1305" class="box-desc">Cross-Calibrated Depth Envelopes + Honest Attribution Tagging</text>

  <!-- Connecting 3A, MinIO, and 3B into Fusion -->
  <path d="M 390 1069 L 390 1292 L 575 1292" class="line" marker-end="url(#arrow)" />
  <line x1="800" y1="1136" x2="800" y2="1260" class="line" marker-end="url(#arrow)" />
  <path d="M 1150 1234 L 1150 1292 L 1025 1292" class="line" marker-end="url(#arrow)" />


  <!-- ==================== STAGE 4: EXPOSURE, EAP & DISPATCH ==================== -->
  <rect x="70" y="1370" width="1460" height="390" class="container-box" />
  <text x="95" y="1395" class="section-label">Stage 4: Exposure Analytics, Statutory EAP &amp; 3D Client Dispatch</text>

  <!-- Flow to Exposure Analytics -->
  <line x1="800" y1="1319" x2="800" y2="1410" class="line" marker-end="url(#arrow)" />

  <rect x="580" y="1410" width="440" height="54" rx="5" ry="5" class="process" />
  <text x="800" y="1432" class="box-title">Exposure Overlay &amp; Vulnerability Classification</text>
  <text x="800" y="1450" class="box-desc">Google Open Buildings V3 (3,842 Dwellings) + WorldPop Ingestion</text>

  <!-- Flow to Hazard Decision -->
  <line x1="800" y1="1464" x2="800" y2="1495" class="line" marker-end="url(#arrow)" />

  <!-- Decision: Hazard Threshold (Diamond) -->
  <polygon points="800,1495 980,1545 800,1595 620,1545" class="decision" />
  <text x="800" y="1540" class="box-title">Hazard Condition Met?</text>
  <text x="800" y="1558" class="box-desc">Water Depth &gt; 0.5m OR Velocity &gt; 2.0 m/s</text>

  <!-- Left: EAP Trigger (Yes) -->
  <path d="M 620 1545 L 370 1545 L 370 1585" class="line" marker-end="url(#arrow)" />
  <rect x="440" y="1527" width="110" height="22" rx="4" ry="4" fill="#0B0F19" />
  <text x="495" y="1542" class="branch-text">Yes (Hazard Zone)</text>

  <!-- Output 1: Section 31 EAP Report (Parallelogram) -->
  <polygon points="200,1640 230,1585 530,1585 500,1640" class="io" />
  <text x="365" y="1607" class="box-title">Section 31 Statutory EAP Action Briefing</text>
  <text x="365" y="1625" class="box-desc">India Dam Safety Act 2021 | PDF &amp; Markdown Evacuation Schedule</text>

  <!-- Right: Low Hazard Log (No) -->
  <path d="M 980 1545 L 1230 1545 L 1230 1585" class="line" marker-end="url(#arrow)" />
  <rect x="1050" y="1527" width="110" height="22" rx="4" ry="4" fill="#0B0F19" />
  <text x="1105" y="1542" class="branch-text">No (Low Risk)</text>

  <rect x="1080" y="1585" width="300" height="55" rx="5" ry="5" class="process" />
  <text x="1230" y="1607" class="box-title">Log Low-Hazard Flow Sector</text>
  <text x="1230" y="1625" class="box-desc">Agricultural Runoff &amp; Infiltration Tracking</text>

  <!-- Center Output: 3D Digital Twin Client -->
  <polygon points="630,1640 660,1585 970,1585 940,1640" class="io" />
  <text x="800" y="1607" class="box-title">CesiumJS 3D Digital Twin Client</text>
  <text x="800" y="1625" class="box-desc">Real-Time Depth Shaders, Velocity HUD &amp; 3D Drone Tour</text>

  <!-- Converge Outputs to Terminal End -->
  <path d="M 365 1641 L 365 1680 L 800 1680" class="line" />
  <path d="M 800 1641 L 800 1700" class="line" marker-end="url(#arrow)" />
  <path d="M 1230 1641 L 1230 1680 L 800 1680" class="line" />

  <!-- Terminator: End -->
  <rect x="630" y="1700" width="340" height="50" rx="25" ry="25" class="terminator" />
  <text x="800" y="1731" class="box-title">Emergency Warning &amp; Operations Dispatched</text>

  <!-- ==================== FLOWCHART LEGEND ==================== -->
  <g transform="translate(180, 1780)">
    <rect x="0" y="0" width="1240" height="45" class="legend-box" rx="6" ry="6" />
    
    <!-- Legend Item 1: Terminator -->
    <rect x="30" y="14" width="36" height="18" rx="9" ry="9" class="terminator" />
    <text x="75" y="28" class="legend-text">Terminator (Start / End)</text>

    <!-- Legend Item 2: Process -->
    <rect x="250" y="14" width="36" height="18" rx="2" ry="2" class="process" />
    <text x="295" y="28" class="legend-text">Process / Computation</text>

    <!-- Legend Item 3: Decision -->
    <polygon points="475,14 490,23 475,32 460,23" class="decision" />
    <text x="500" y="28" class="legend-text">Decision Diamond</text>

    <!-- Legend Item 4: Input / Output -->
    <polygon points="650,32 658,14 690,14 682,32" class="io" />
    <text x="700" y="28" class="legend-text">Input / Output (Data / Report)</text>

    <!-- Legend Item 5: Data Store -->
    <rect x="910" y="14" width="36" height="18" rx="2" ry="2" class="datastore" />
    <text x="955" y="28" class="legend-text">Data Store (PostGIS / S3)</text>
  </g>

</svg>